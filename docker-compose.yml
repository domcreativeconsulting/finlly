services:
  postgres:
    image: postgres:15-alpine
    container_name: finlly_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: finlly
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - finlly_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d finlly"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finlly_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - finlly_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  finlly_network:
    driver: bridge
