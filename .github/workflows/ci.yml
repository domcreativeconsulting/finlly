name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Prepare (setup husky)
        run: npm run prepare

      - name: Run lint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Prepare (setup husky)
        run: npm run prepare

      - name: Run tests
        run: npm run test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Prepare (setup husky)
        run: npm run prepare

      - name: Run tests with coverage
        run: npm run test:coverage --workspace=apps/api

  integration-test:
    name: Integration Tests (Webhook)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finlly_test
          POSTGRES_PASSWORD: finlly_test
          POSTGRES_DB: finlly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://finlly_test:finlly_test@localhost:5432/finlly_test
      DATABASE_URL: postgresql://finlly_test:finlly_test@localhost:5432/finlly_test
      NODE_ENV: test
      JWT_SECRET: test_secret_minimum_32_chars_long_enough_for_tests
      ASAAS_WEBHOOK_SECRET: ""

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Prepare (setup husky)
        run: npm run prepare

      - name: Apply migrations on test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://finlly_test:finlly_test@localhost:5432/finlly_test

      - name: Run integration tests
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://finlly_test:finlly_test@localhost:5432/finlly_test
          DATABASE_URL: postgresql://finlly_test:finlly_test@localhost:5432/finlly_test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test, integration-test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install all dependencies (root + workspaces)
        run: npm ci

      - name: Prepare (setup husky)
        run: npm run prepare

      - name: Build Web App
        run: npm run build
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: http://localhost:3001

      - name: Build API (if applicable)
        run: npm run build 2>/dev/null || true
        working-directory: apps/api
