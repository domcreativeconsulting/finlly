name: CI

on:
  push:
    branches:
      - main

jobs:
  test-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm install

      - name: Apply migrations
        run: npx prisma db push --schema=prisma/schema.prisma --skip-generate --accept-data-loss --url postgresql://test:test@localhost:5432/finlly_test

      - name: Run integration tests
        run: npm test --integration
